name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tes backend & build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, intl, mbstring, zip, sqlite3, pdo_sqlite, fileinfo
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependensi PHP
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install dependensi JS & build
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npm run build

      - name: Siapkan environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Jalankan tes
        run: php artisan test
